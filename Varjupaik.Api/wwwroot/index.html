<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loomade varjupaik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <strong>Loomade varjupaik</strong>
    <nav id="menu"></nav>
</header>

<main>
    <h1>Loomad, kes ootavad kodu</h1>

    <div class="filters">
        <input id="species" placeholder="Liik (nt Kass, Koer)">
        <select id="status">
            <option value="">Kõik olekud</option>
            <option value="Available">Saadaval</option>
            <option value="Reserved">Broneeritud</option>
            <option value="Adopted">Adopteeritud</option>
        </select>
        <button onclick="loadAnimals()">Otsi</button>
    </div>

    <div id="animals" class="animals"></div>

    <form id="applyForm" class="box" style="display:none; margin-top:20px">
        <h2>Taotlus: <span id="applyName"></span></h2>
        <label>Miks soovid seda looma adopteerida?</label>
        <textarea id="applyMessage" rows="4" required></textarea>
        <button type="submit">Saada taotlus</button>
        <button type="button" onclick="closeForm()">Tühista</button>
    </form>
    <div id="message" class="message"></div>
</main>

<script src="app.js"></script>
<script>
    let selectedAnimalId = null;

    async function loadAnimals() {
        const species = document.getElementById("species").value;
        const status = document.getElementById("status").value;
        const params = new URLSearchParams();
        if (species) params.append("species", species);
        if (status) params.append("status", status);

        const response = await fetch("/api/animals?" + params.toString());
        const animals = (await response.json()).items;

        const user = getUser();
        const container = document.getElementById("animals");
        container.innerHTML = "";

        if (animals.length === 0) {
            container.innerHTML = "<p>Loomi ei leitud.</p>";
            return;
        }

        for (const animal of animals) {
            const card = document.createElement("div");
            card.className = "card";

            card.appendChild(animalImage(animal));

            const title = document.createElement("h3");
            title.textContent = animal.name;
            card.appendChild(title);

            const info = document.createElement("p");
            info.textContent = animal.species + ", " + animal.age + " a";
            card.appendChild(info);

            const status = document.createElement("span");
            status.className = "status " + animal.status;
            status.textContent = statusNames[animal.status];
            card.appendChild(status);

            const desc = document.createElement("p");
            desc.textContent = animal.description;
            card.appendChild(desc);

            if (animal.status !== "Adopted") {
                const button = document.createElement("button");
                button.textContent = "Esita taotlus";
                button.onclick = () => openForm(animal);
                card.appendChild(button);
            }

            container.appendChild(card);
        }
    }

    function openForm(animal) {
        const user = getUser();
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        if (user.role !== "Visitor") {
            document.getElementById("message").textContent = "Taotlust saab esitada ainult külastaja konto.";
            return;
        }
        selectedAnimalId = animal.id;
        document.getElementById("applyName").textContent = animal.name;
        document.getElementById("applyForm").style.display = "block";
        document.getElementById("applyForm").scrollIntoView();
    }

    function closeForm() {
        document.getElementById("applyForm").style.display = "none";
    }

    document.getElementById("applyForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = document.getElementById("applyMessage").value;

        const response = await api("/api/animals/" + selectedAnimalId + "/applications", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: message })
        });

        const msg = document.getElementById("message");
        if (response.ok) {
            msg.textContent = "Taotlus on saadetud!";
            document.getElementById("applyMessage").value = "";
            closeForm();
        } else {
            msg.textContent = await errorText(response);
        }
    });

    showMenu();
    loadAnimals();
</script>
</body>
</html>
